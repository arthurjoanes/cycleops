[project]
name = "cycleops"
version = "0.1.0"
description = "Bike-share station dashboard for Oslo built on open GBFS data"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3,<7",
    # zoneinfo precisa da base de fusos no Windows
    "tzdata>=2025.2",
]

[project.scripts]
inspect-feed = "cycleops.cli.inspect_feed:main"
record-feed = "cycleops.cli.record_feed:main"
compile-replay = "cycleops.cli.compile_replay:main"
generate-artifacts = "cycleops.cli.generate_artifacts:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "DTZ"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
