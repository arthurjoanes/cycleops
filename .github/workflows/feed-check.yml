# Manual run against the real Oslo feed. Never a PR gate.
# inspect-feed makes exactly 5 requests (the cap); its recording stays in the runner.
name: feed-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-feed:
    if: github.repository == 'arthurjoanes/cycleops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - run: uv sync --project apps/backend --locked
      - run: uv run --project apps/backend inspect-feed
        env:
          CYCLEOPS_CLIENT_IDENTIFIER: arthurjoanes-cycleops
