version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # infra/*.Dockerfile, then the postgres image of the Compose files. The same postgres
  # image in the CI service container is not covered: update it by hand with these.
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
